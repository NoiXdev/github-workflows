name: Create Compose Changelog + Version + Release
on:
  workflow_call:
    inputs:
      product_name:
        description: >
          Name shown in the release notification. Empty uses the repository
          name, which is the right answer for every product so far.
        type: string
        default: ""

jobs:
  release:
    name: Create Compose Changelog + Version + Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate changelog and calculate version number
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-file: ./composer.json # Change this to any other yaml or json file to store/bump the latest version in it
          skip-on-empty: false

      - name: Create release
        id: release
        if: ${{ steps.changelog.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.github_token }}
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}

      - name: Announce the release
        # Only when one was made: with no conventional commits since the last
        # tag there is no release to announce. Never able to fail the release
        # either — it is already published by the time this runs.
        if: ${{ steps.changelog.outputs.tag }}
        continue-on-error: true
        uses: NoiXdev/github-workflows/actions/announce-release@main
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_RELEASE_NOTIFICATION }}
          tag: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          url: ${{ steps.release.outputs.url }}
          product-name: ${{ inputs.product_name }}
