name: Build Tauri Android APK

# Reusable APK build for Tauri mobile apps. Builds a debug-signed (installable,
# no signing secrets required) APK for one ABI, uploads it as a workflow
# artifact, and — when `release_tag` is given (or the caller was triggered by a
# published release) — attaches the APK to that release. Does NOT publish to any
# app store.
#
# Chain it after a release job and pass `release_tag` so it reliably attaches
# even when the release was created by GITHUB_TOKEN (which does not fire the
# `release: published` event). The caller repo must have committed its
# `tauri android init` output (src-tauri/gen/android). Pass `secrets: inherit`.

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"
      ndk_version:
        description: "Android NDK version to install"
        type: string
        default: "26.1.10909125"
      target:
        description: "Tauri Android ABI short name: aarch64, armv7, i686 or x86_64"
        type: string
        default: aarch64
      rust_target:
        description: "Rust target triple matching `target`"
        type: string
        default: aarch64-linux-android
      tauri_dir:
        description: "Path to the Tauri crate directory"
        type: string
        default: src-tauri
      release_tag:
        description: "If set, build that tag and attach the APK to its release"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK (${{ inputs.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the release tag when attaching to a release, otherwise the
          # triggering commit. (Empty ref would default to the triggering ref.)
          ref: ${{ inputs.release_tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${{ inputs.ndk_version }}"

      - name: Install Rust toolchain + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.tauri_dir }}

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/${{ inputs.ndk_version }}"
          npx tauri android build --debug --apk --target ${{ inputs.target }}

      - name: Stage APK
        id: stage
        run: |
          mkdir -p dist
          ref="${{ inputs.release_tag || github.event.release.tag_name || github.sha }}"
          name="${{ github.event.repository.name }}-${ref}-android-${{ inputs.target }}-debug.apk"
          src="$(find "${{ inputs.tauri_dir }}/gen/android/app/build/outputs/apk" -name '*-debug.apk' | head -1)"
          cp "$src" "dist/$name"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.target }}
          path: ${{ steps.stage.outputs.path }}

      - name: Attach APK to release
        if: ${{ inputs.release_tag != '' || github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.event.release.tag_name }}
          files: ${{ steps.stage.outputs.path }}
