name: Create Docker Changelog + Version + Release

# Reusable, dispatch-driven release for a product that ships a container image.
# The caller picks a bump; this workflow computes the next version, writes it
# into the tree, builds and pushes the image, commits, tags, releases and
# announces.
#
# Three things are worth knowing before changing the order of the steps.
#
# The image is built AFTER the version is written, because a product whose
# binary or package metadata carries its version would otherwise ship an
# image claiming the previous one.
#
# The image is pushed BEFORE the commit and the tag. Neither order is atomic,
# so the question is which orphan is cheaper: a pushed image whose release
# failed is a tag nobody references and the same tag can be pushed again,
# while a pushed git tag whose image push failed is a tag in a public
# repository that others may already have fetched.
#
# A pre-release publishes exactly one image tag. `latest` and the truncated
# semver tags are all gated on the release not being one, because a candidate
# that moved `latest` would hand itself to everyone who pins nothing.
on:
  workflow_call:
    inputs:
      bump:
        description: "Version bump: patch, minor or major"
        required: true
        type: string
      prerelease_id:
        description: >
          Prerelease identifier (alpha, beta, rc). Empty produces a final
          version, which is what every existing caller gets. From 0.0.0 with
          bump=minor and id=rc comes 0.1.0-rc.1; calling again with the same
          id yields 0.1.0-rc.2; calling with an empty id promotes it to 0.1.0
          and ignores the bump.
        type: string
        default: ""
      prerelease:
        description: >
          Force the GitHub release to be marked as a pre-release. A version
          carrying a prerelease part marks itself, so this is only needed to
          flag an otherwise final version.
        type: boolean
        default: false
      dry_run:
        description: >
          Build everything but push nothing: no image, no commit, no tag, no
          release. It still validates the Docker Hub configuration, so a
          missing secret is caught by the rehearsal, and it still writes the
          GitHub Actions build cache; neither is a push.
        type: boolean
        default: false
      platforms:
        description: >
          Comma-separated build platforms. The default is the single platform
          every existing caller builds today; naming a second one builds a
          multi-architecture image through QEMU.
        type: string
        default: linux/amd64
      version_file:
        description: >
          JSON file holding the current version. `compute-version` reads it
          with node, so it has to be JSON - a TOML or YAML manifest needs
          `version_script` below instead. The file is rewritten with
          `JSON.stringify(data, null, 2)`, so a manifest indented with tabs or
          four spaces comes back two-space indented.
        type: string
        default: package.json
      version_script:
        description: >
          Executable in the repository, invoked as `./<script> <version>`,
          that writes the version into every other file naming one. Empty
          means only `version_file` is written, which is what a product with a
          single manifest wants.
        type: string
        default: ""
      product_name:
        description: >
          Name shown in the release notification and the image title. Empty
          uses the repository name.
        type: string
        default: ""
      release_files:
        description: "Paths attached to the GitHub release. Empty attaches nothing."
        type: string
        default: ""
      ref:
        description: >
          The commit or ref to release. Empty uses `main`, which is what every
          existing caller gets. A caller that gates the release on jobs of its
          own passes its own github.sha - deliberately written without
          expression braces, because GitHub evaluates expressions in an input
          description too and the `github` context does not exist there, which
          makes the whole workflow unresolvable for every caller. Those jobs
          ran on that commit, and without this the release would check out
          whatever `main` points at by the time they finish - a tree nothing
          gated.
        type: string
        default: ""
      extra_image:
        description: >
          A second image to build and push with this same release: the Docker
          Hub repository name under the same namespace as the main image (for
          example `ddev-sync-endpoint`). Empty builds nothing, which is what
          every existing caller gets. It is built from the same tree, after
          the version has been written, with the same platforms and under the
          same `dry_run` gate, and it carries the same tags - a product that
          ships two images ships them as one version, and the rules that
          decide which tags move live in one place.
        type: string
        default: ""
      extra_image_dockerfile:
        description: >
          Path to that image's dockerfile, relative to the repository root
          (for example `endpoint/Dockerfile`). Required when `extra_image` is
          set.
        type: string
        default: ""
      extra_image_context:
        description: >
          Build context for that image. The default is the repository root,
          like the main image. Name its own directory instead when the image
          is self-contained: the context is the build cache's key, so a
          four-file image built from the whole repository is rebuilt by every
          unrelated commit, and its dockerfile's COPY paths then have to be
          written relative to the root rather than to the directory they sit
          in.
        type: string
        default: "."
    outputs:
      tag:
        description: "The created release tag (e.g. v0.1.0-rc.1)"
        value: ${{ jobs.release.outputs.tag }}
      version:
        description: "The released version, without the leading v"
        value: ${{ jobs.release.outputs.version }}
      is_prerelease:
        description: >
          "true" when the released version carries a prerelease part. Callers
          gate anything that must only see final releases on this.
        value: ${{ jobs.release.outputs.is_prerelease }}
      release_url:
        description: "URL of the GitHub release, empty on a dry run"
        value: ${{ jobs.release.outputs.release_url }}
      image_digest:
        description: "Digest of the pushed image, empty on a dry run"
        value: ${{ jobs.release.outputs.image_digest }}
      extra_image_digest:
        description: >
          Digest of the second image, empty on a dry run and when
          `extra_image` was not set.
        value: ${{ jobs.release.outputs.extra_image_digest }}

permissions:
  contents: write

jobs:
  release:
    name: Create Docker Changelog + Version + Release
    runs-on: ubuntu-latest
    # A multi-architecture build under emulation is the slow part; the default
    # six hours would hold a runner for a whole working day if it hung.
    timeout-minutes: 90
    # Step outputs are job-local, so everything the announce job and the
    # caller need has to be re-exported here.
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.next }}
      is_prerelease: ${{ steps.ver.outputs.is-prerelease }}
      release_url: ${{ steps.gh_release.outputs.url }}
      image_digest: ${{ steps.build.outputs.digest }}
      extra_image_digest: ${{ steps.build_extra.outputs.digest }}
      notes: ${{ steps.changelog.outputs.clean_changelog }}
    steps:
      # First, so that a missing variable is named here instead of surfacing
      # as an authentication error from the registry halfway through.
      - name: Validate the Docker Hub configuration
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EXTRA_IMAGE: ${{ inputs.extra_image }}
          EXTRA_IMAGE_DOCKERFILE: ${{ inputs.extra_image_dockerfile }}
        run: |
          : "${DOCKERHUB_NAMESPACE:?Variable DOCKERHUB_NAMESPACE is not set}"
          : "${DOCKERHUB_IMAGE:?Variable DOCKERHUB_IMAGE is not set}"
          : "${DOCKERHUB_USERNAME:?Secret DOCKERHUB_USERNAME is not set}"
          : "${DOCKERHUB_TOKEN:?Secret DOCKERHUB_TOKEN is not set}"
          # Named here for the same reason as the four above: left to the
          # build, an empty dockerfile path surfaces as docker's own complaint
          # a long way in - after the version has been written and the first
          # image pushed, which is the expensive place to stop.
          if [ -n "${EXTRA_IMAGE}" ] && [ -z "${EXTRA_IMAGE_DOCKERFILE}" ]; then
            echo "::error::extra_image is '${EXTRA_IMAGE}' but extra_image_dockerfile is empty"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog is built from the commits since the last tag, so a
          # shallow clone would see neither the tag nor most of the history.
          fetch-depth: 0
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Compute the next version
        id: ver
        # Deliberately unpinned: it is this repository's own action, and the
        # README records why the self-references float.
        uses: NoiXdev/github-workflows/actions/compute-version@main
        with:
          bump: ${{ inputs.bump }}
          prerelease: ${{ inputs.prerelease_id }}
          version-file: ${{ inputs.version_file }}

      # Through the environment rather than interpolated into the script text,
      # for the reason `compute-version` gives for its own env block: `${{ }}`
      # is substituted before bash sees the line.
      - name: Write the version into the version file
        env:
          VERSION_FILE: ${{ inputs.version_file }}
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const file = process.env.VERSION_FILE;
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            data.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
          '

      - name: Write the version everywhere else
        if: ${{ inputs.version_script != '' }}
        env:
          VERSION_SCRIPT: ${{ inputs.version_script }}
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          if [ ! -x "./${VERSION_SCRIPT}" ]; then
            echo "::error::${VERSION_SCRIPT} is not an executable file in this repository"
            exit 1
          fi
          "./${VERSION_SCRIPT}" "${VERSION}"

      # What catches a version_script that silently did nothing, and a
      # version_file the script rewrote back to something else.
      - name: Verify the version is in sync
        env:
          VERSION_FILE: ${{ inputs.version_file }}
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          have="$(node -p "require('./' + process.env.VERSION_FILE).version")"
          if [ "${have}" != "${VERSION}" ]; then
            echo "::error::${VERSION_FILE} says ${have}, the release is ${VERSION}"
            exit 1
          fi
          echo "${VERSION_FILE} says ${have} - in sync"

      - name: Generate CHANGELOG.md
        id: changelog
        # Text only: the version is owned by the steps above, so every skip-*
        # is on to stop this action from bumping, committing or tagging.
        uses: TriPSs/conventional-changelog-action@ee43def3241429afddab215ba89090cbf64fb45c # v6.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preset: conventionalcommits
          tag-prefix: "v"
          output-file: CHANGELOG.md
          release-count: 0
          skip-commit: "true"
          skip-tag: "true"
          skip-bump: "true"
          skip-version-file: "true"
          skip-on-empty: "false"
          # The version is owned by `compute-version`, and with `skip-bump` on
          # this is the only way the generated heading can carry it: the
          # action only learns a version inside the bump it has been told to
          # skip, so without this the heading is version-less on every release.
          fallback-version: ${{ steps.ver.outputs.next }}
          # Leaving this at its default would make a second candidate's notes
          # restate every commit since the last stable tag; the derived flag
          # keeps them to the commits since the previous candidate.
          pre-release: ${{ steps.ver.outputs.is-prerelease }}
          # Both of these matter because `ref` above may be a commit rather
          # than a branch, which leaves a detached HEAD: this action's `git
          # pull` is not gated on `skip-commit` or `skip-tag`, and on a
          # detached HEAD it fails with "You are not currently on a branch",
          # taking the whole release with it. The pull is redundant here in
          # any case - `fetch-depth: 0` above already fetched the full history
          # and every tag, which is exactly what this input's own description
          # says it is for. `git-push` is off for the same shape of reason: it
          # is not gated on `skip-commit` either, and the commit, the tag and
          # the push are this workflow's own job a few steps below.
          skip-git-pull: "true"
          git-push: "false"

      # Only needed when `platforms` names something the runner is not, but
      # setting it up unconditionally costs seconds and removes a conditional
      # whose failure mode is an unexplained "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: ${{ inputs.dry_run == false }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_IMAGE }}
          # In its default `auto` flavor the action sets `latest` itself for a
          # `type=semver` entry whose version carries no pre-release part
          # (src/meta.ts:183-196 at the pinned commit) - past the `enable=`
          # gates below, which it never consults. A candidate escapes that by
          # accident, because its version has a pre-release part; a release
          # marked pre-release through the `prerelease` input while carrying a
          # final version does not, and that input exists for exactly that
          # case. So the implicit tag is switched off and the explicit, gated
          # entry is the only thing that can produce `latest`.
          flavor: |
            latest=false
          # `{{version}}` always; everything that moves is gated on this not
          # being a pre-release, derived from the computed version as well as
          # from the input so the two cannot disagree.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ inputs.prerelease == false && steps.ver.outputs.is-prerelease != 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.tag }},enable=${{ inputs.prerelease == false && steps.ver.outputs.is-prerelease != 'true' }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.tag }},enable=${{ inputs.prerelease == false && steps.ver.outputs.is-prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=${{ inputs.product_name || github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.next }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.dry_run == false }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image: with `mode=max` and no scope, two builds in one
          # job write the same cache index and each overwrites the other's, so
          # every release would rebuild one of the two multi-architecture
          # images from scratch under emulation.
          cache-from: type=gha,scope=main-image
          cache-to: type=gha,mode=max,scope=main-image

      # The second image, when the caller named one. Its own metadata step
      # rather than one `images:` list with two entries, because the title
      # label differs - a reader pulling either image should find its own
      # name in it - and its own build step because the dockerfile and the
      # context differ. Everything that decides *which* tags are produced is
      # copied verbatim from the main image's step above, deliberately: a
      # second image of the same product moves `latest` under the same
      # conditions or not at all, and the gate is argued once, up there.
      - name: Compute the tags for the second image
        id: meta_extra
        if: ${{ inputs.extra_image != '' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ inputs.extra_image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ inputs.prerelease == false && steps.ver.outputs.is-prerelease != 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.tag }},enable=${{ inputs.prerelease == false && steps.ver.outputs.is-prerelease != 'true' }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.tag }},enable=${{ inputs.prerelease == false && steps.ver.outputs.is-prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=${{ inputs.extra_image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.next }}

      - name: Build and push the second image
        id: build_extra
        if: ${{ inputs.extra_image != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.extra_image_context }}
          file: ${{ inputs.extra_image_dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.dry_run == false }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta_extra.outputs.tags }}
          labels: ${{ steps.meta_extra.outputs.labels }}
          cache-from: type=gha,scope=extra-image
          cache-to: type=gha,mode=max,scope=extra-image

      # A dry run's whole purpose is to be read, and the version rewrite is
      # the thing most worth reading: a compose default naming a tag that was
      # never published does not fail at sync time, it stops the project from
      # starting at all. Without this the rehearsal shows what it *would* have
      # tagged but not what it changed in the tree.
      - name: Show what the rehearsal changed
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run - nothing was pushed"
            echo ""
            echo "No image, no commit, no tag, no release, no announcement."
            echo ""
            echo "Files the rehearsal touched, tracked and untracked:"
            echo '```'
            git status --short
            echo '```'
            echo ""
            echo "Diffstat of the tracked ones:"
            echo '```'
            git diff --stat
            echo '```'
            echo ""
            echo "<details><summary>Full diff</summary>"
            echo ""
            echo '```diff'
            git diff
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # `git diff` covers tracked files only, so the changelog a first
          # release creates would be invisible above. Its heading is worth
          # reading: the version in it comes from `fallback-version`, because
          # `skip-bump` stops the action computing one of its own, and a
          # rehearsal that cannot show it leaves that unverifiable until a
          # real release. Guarded, since a repository with no changelog, or
          # an `output-file` elsewhere, must not fail the rehearsal.
          if [ -f CHANGELOG.md ]; then
            {
              echo "<details><summary>CHANGELOG.md, first 40 lines</summary>"
              echo ""
              echo '```markdown'
              head -40 CHANGELOG.md
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the version and the changelog, then tag
        if: ${{ inputs.dry_run == false }}
        env:
          GIT_AUTHOR_NAME: noix-dev-bot
          GIT_AUTHOR_EMAIL: noix-dev-bot@noix.dev
          GIT_COMMITTER_NAME: noix-dev-bot
          GIT_COMMITTER_EMAIL: noix-dev-bot@noix.dev
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # -A rather than a fixed list: `version_script` writes files at paths
          # this workflow cannot predict, and a version written but left
          # uncommitted is the worst of both outcomes.
          # The checkout may be a detached commit that is not the tip of main:
          # the push below is a fast-forward while main has not moved and is
          # rejected if it has, which is intended - loud, before anything is
          # tagged, instead of a silently ungated release.
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            # [skip ci] so the release commit does not start another CI run.
            git commit -m "chore(release): ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Create the GitHub release
        id: gh_release
        if: ${{ inputs.dry_run == false }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          # Either the caller asked for it, or the version says so. Derived
          # rather than trusted, so a release cannot be marked final while
          # carrying a candidate version.
          prerelease: ${{ inputs.prerelease || steps.ver.outputs.is-prerelease == 'true' }}
          files: ${{ inputs.release_files }}

      # Every value through the environment, for the reason the version-write
      # step gives: `bump` and `platforms` are free text, and `${{ }}` inside
      # `run:` is substituted before bash sees the line.
      - name: Summary
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          PREVIOUS: ${{ steps.ver.outputs.current }}
          NEXT: ${{ steps.ver.outputs.next }}
          BUMP: ${{ inputs.bump }}
          IS_PRERELEASE: ${{ steps.ver.outputs.is-prerelease }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          PLATFORMS: ${{ inputs.platforms }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Release ${TAG}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Previous version | \`${PREVIOUS}\` |"
            echo "| New version | \`${NEXT}\` |"
            echo "| Bump type | \`${BUMP}\` |"
            echo "| Prerelease (derived) | \`${IS_PRERELEASE}\` |"
            echo "| Prerelease (input) | \`${PRERELEASE_INPUT}\` |"
            echo "| Platforms | \`${PLATFORMS}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo ""
            echo "**Image tags:**"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  announce:
    name: Announce the release
    needs: [release]
    # No `always()`: when the release job fails nothing shipped, so a skipped
    # announcement is the correct outcome. Dry runs create no release either.
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        # A notification is the least important thing this workflow does and
        # must never fail the release.
        continue-on-error: true
        uses: NoiXdev/github-workflows/actions/announce-release@main
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_RELEASE_NOTIFICATION }}
          tag: ${{ needs.release.outputs.tag }}
          body: ${{ needs.release.outputs.notes }}
          url: ${{ needs.release.outputs.release_url }}
          product-name: ${{ inputs.product_name }}
