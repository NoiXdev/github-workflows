name: Set Tauri project version
description: >
  Set the project version in every file a Tauri app carries it in, so a release
  is fully driven by one version number: package.json (+ package-lock.json),
  <tauri-dir>/tauri.conf.json, and the [package] version in <tauri-dir>/Cargo.toml
  (+ its entry in Cargo.lock). `extra-crates` covers the rest of a Cargo
  workspace, whose other members carry the same version and would otherwise be
  left behind. Uses only Node/npm/Perl — no Rust toolchain needed. Dependency
  versions are left untouched.

inputs:
  version:
    description: "The version to set (no leading v), e.g. 1.2.3"
    required: true
  tauri-dir:
    description: "Path to the Tauri crate directory (holding Cargo.toml / tauri.conf.json)"
    required: false
    default: src-tauri
  extra-crates:
    description: >
      Further crate directories carrying the same version — the other members
      of a Cargo workspace. Comma- or newline-separated. Empty by default,
      which is what a single-crate project needs, so existing callers are
      unaffected. A project that releases a workspace and leaves this empty
      ships a library and a binary claiming different versions.
    required: false
    default: ""
  app-dir:
    description: >
      Directory holding package.json. Defaults to the repository root, which
      is where a plain Tauri project keeps it; a Cargo workspace that puts the
      frontend in a subdirectory names it here.
    required: false
    default: "."
  cargo-lock:
    description: >
      Path to the Cargo.lock holding these crates. Defaults to the one beside
      the Tauri crate; a workspace keeps a single lock file at its root.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        V: ${{ inputs.version }}
        DIR: ${{ inputs.tauri-dir }}
        EXTRA: ${{ inputs.extra-crates }}
        LOCK: ${{ inputs.cargo-lock }}
        APP: ${{ inputs.app-dir }}
      run: |
        set -euo pipefail

        # package.json + package-lock.json
        test -f "$APP/package.json" || { echo "::error::No package.json in $APP"; exit 1; }
        (cd "$APP" && npm version "$V" --no-git-tag-version --allow-same-version >/dev/null)

        # tauri.conf.json (drives the app + Windows/Linux artifact version)
        node -e "const fs=require('fs');const f=process.env.DIR+'/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.env.V;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

        lock="${LOCK:-$DIR/Cargo.lock}"
        test -f "$lock" || { echo "::error::No Cargo.lock at $lock"; exit 1; }

        # Every crate carrying this version: the Tauri crate, plus any
        # workspace members the caller named. Split on commas and newlines so
        # either style reads well in YAML.
        crates=("$DIR")
        while IFS= read -r line; do
          [ -n "$line" ] && crates+=("$line")
        done < <(printf '%s\n' "$EXTRA" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

        for dir in "${crates[@]}"; do
          manifest="$dir/Cargo.toml"
          test -f "$manifest" || { echo "::error::No Cargo.toml at $manifest"; exit 1; }

          # Only the [package] version, never a dependency's.
          perl -0pi -e 's/(\[package\][^\[]*?\nversion = ")[^"]*(")/$1$ENV{V}$2/s' "$manifest"

          # The lock entry, matched by the crate's own name. A crate missing
          # from the lock is a mistake worth stopping for: the build would use
          # a stale version and nobody would see it.
          NAME=$(perl -0ne 'print $1 if /\[package\][^\[]*?\nname = "([^"]+)"/s' "$manifest")
          test -n "$NAME" || { echo "::error::Cannot read a package name from $manifest"; exit 1; }
          if ! grep -q "name = \"$NAME\"" "$lock"; then
            echo "::error::$NAME is not in $lock"
            exit 1
          fi
          NAME="$NAME" perl -0pi -e 's/(name = "\Q$ENV{NAME}\E"\nversion = ")[^"]*(")/$1$ENV{V}$2/' "$lock"
          echo "  $manifest ($NAME)"
        done

        echo "::notice::Set version to $V across $APP/package.json, $DIR/tauri.conf.json, ${#crates[@]} crate(s) and $lock"
